name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      TAB2API_API_TOKEN: ci-only-token-with-at-least-24-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Parse Windows scripts
        if: runner.os == 'Windows' && matrix.node == 22
        shell: pwsh
        run: |
          Get-ChildItem scripts/windows -Filter *.ps1 | ForEach-Object {
            [scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw)) | Out-Null
          }
      - run: npm run check
      - run: npm test
      - name: Enforce source coverage thresholds
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm audit --audit-level=high
