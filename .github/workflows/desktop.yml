name: Desktop CI

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      TAB2API_API_TOKEN: ci-only-token-with-at-least-24-characters
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain components
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install pinned Rust dependency auditor
        if: runner.os == 'Linux'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        if: runner.os == 'Linux'
        run: npm run desktop:audit

      - name: Install Node dependencies
        run: npm ci

      - name: Build the Node sidecar
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path desktop/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path desktop/Cargo.toml --locked --all-targets --all-features

      - name: Compile the desktop application without packaging
        run: npx tauri build --no-bundle --config desktop/tauri.conf.json
