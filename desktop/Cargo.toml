[package]
name = "tab2api-desktop"
version = "0.3.0"
description = "Native desktop controller for the local tab2api sidecar"
authors = ["tab2api contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[lib]
name = "tab2api_desktop"
path = "src/lib.rs"

[[bin]]
name = "tab2api-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
