[package]
name = "tab2api-desktop"
version = "0.1.0"
description = "Native desktop controller for the local tab2api sidecar"
authors = ["tab2api contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[lib]
name = "tab2api_desktop"
path = "src/lib.rs"

[[bin]]
name = "tab2api-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
